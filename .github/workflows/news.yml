name: Update gaming news

on:
  schedule:
    - cron: "7,37 * * * *"      # every 30 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:             # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Exits non-zero when too few items were collected, so a broken run never
      # replaces the last good deployment.
      - name: Fetch and normalise feeds
        run: python3 fetch_news.py --out site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
